[package]
name = "aeroenhance-studio"
version = "0.7.0-beta.1"
edition = "2024"
authors = ["AeroStudios"]
description = "Native Rust desktop photo enhancement studio"
license = "MIT"
build = "build.rs"

[features]
default = ["aeroroom-raw"]
aeroroom-raw = ["dep:lightcraft-raw", "dep:lightcraft-color"]
ai = ["dep:ort", "dep:ndarray"]
# CUDA needs compatible NVIDIA CUDA/cuDNN libraries and an ONNX Runtime GPU build.
ai-cuda = ["ai", "ort/cuda"]

[dependencies]
anyhow = "1"
lightcraft-raw = { path = "../../shared/aeroroom-raw-engine/crates/raw", optional = true }
lightcraft-color = { path = "../../shared/aeroroom-raw-engine/crates/color", optional = true }
eframe = { version = "=0.37.0", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp"] }
rfd = "0.15"
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "ndarray", "download-binaries", "copy-dylibs", "api-31", "tls-native"] }
ndarray = { version = "0.17", optional = true }

# Private-beta networking. No HTTP requests occur until the user explicitly
# requests them or has opted in to startup update checks.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
ed25519-dalek = "2.2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
semver = "1.0"
url = "2.5"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[profile.release]
lto = "thin"
codegen-units = 1

