[package]
name = "aeroenhance-feedback-server"
default-run = "aeroenhance-feedback-server"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
getrandom = "0.3"
uuid = { version = "1", features = ["v4", "serde"] }
subtle = "2.6"
